<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>GS Anlık Haber Merkezi</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #f7f9f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; text-align: center; }
        button { background: #a90432; color: white; border: none; padding: 15px; border-radius: 20px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/f6/Galatasaray_Sports_Club_Logo.png" style="width:80px;">
    <h1>GS Haber Radar</h1>
    <button id="bildirimBtn" onclick="aktiveEt()">Sistemi ve Sesi Aktif Et 🦁</button>
    <div id="haberAkisi"></div>
</div>

<script>
    const socket = io();
    // Tarayıcının engellememesi için sesi butona basınca hazırlıyoruz
    const kükreme = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'); // Örnek ses
    // NOT: Gerçek aslan sesi için profesyonel bir sunucudan çekiyoruz:
    const aslanSesi = new Audio('https://actions.google.com/sounds/v1/animals/lion_roar.ogg');

    function aktiveEt() {
        // İzinleri iste
        Notification.requestPermission();
        // Sesi bir kez çal-durdur yaparak "hazırla"
        aslanSesi.play().then(() => {
            aslanSesi.pause();
            aslanSesi.currentTime = 0;
            alert("🦁 Kükreme sesi hazırlandı! Gerçek haberlerde otomatik çalacak.");
        });
    }

    socket.on('yeni_haber', (haber) => {
        // Haberi ekle
        document.getElementById('haberAkisi').insertAdjacentHTML('afterbegin', `<div><b>${haber.muhabir}:</b> ${haber.mesaj}</div><hr>`);
        
        // Aslanı kükret!
        aslanSesi.play().catch(e => console.log("Hata:", e));
        
        if (Notification.permission === 'granted') {
            new Notification('YENİ HABER', { body: haber.mesaj });
        }
    });
</script>
</body>
</html>
