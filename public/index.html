<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Anlık Haber Merkezi</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f7f9f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #a90432; }
        .logo { width: 85px; display: block; margin: 0 auto 10px auto; }
        h1 { color: #a90432; text-align: center; margin-bottom: 5px; margin-top: 0; }
        button { background-color: #a90432; color: white; border: none; padding: 12px 20px; border-radius: 20px; cursor: pointer; display: block; margin: 10px auto; font-weight: bold; width: 80%; }
        .btn-test { background-color: #555; } /* Test butonu gri */
        .tweet { border-bottom: 1px solid #eee; padding: 15px 0; }
        .author { font-weight: bold; color: #a90432; }
    </style>
</head>
<body>
<div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/f6/Galatasaray_Sports_Club_Logo.png" alt="GS Logo" class="logo">
    <h1>GS Haber Radar</h1>
    <button id="bildirimBtn" onclick="bildirimIzniIste()">Anlık Bildirimleri Aç</button>
    <button class="btn-test" onclick="testHaberiniTetikle()">Test Haberi Gönder 🦁</button>
    <div id="haberAkisi"></div>
</div>

<!-- Daha tok ve gerçekçi bir Aslan Kükremesi -->
<audio id="bildirimSesi" src="https://www.soundboard.com/track/download/123062" preload="auto"></audio>

<script>
    const socket = io();
    const bildirimSesi = document.getElementById('bildirimSesi');

    // Test Butonu: Sistemin çalışıp çalışmadığını anında görmeni sağlar
    function testHaberiniTetikle() {
        const testHaberi = {
            muhabir: "Test Muhabiri",
            kullanici_adi: "@GS_Radar_Test",
            mesaj: "🦁 ASLAN KÜKREDİ! Sistem şu an kusursuz çalışıyor, gerçek haber düştüğü an bildirim alacaksın.",
            saat: new Date().toLocaleTimeString('tr-TR')
        };
        ekranaHaberBas(testHaberi);
    }

    function ekranaHaberBas(haber) {
        const haberHTML = `<div class="tweet"><div class="author">${haber.muhabir} ${haber.kullanici_adi}</div><div>${haber.mesaj}</div><small>${haber.saat}</small></div>`;
        document.getElementById('haberAkisi').insertAdjacentHTML('afterbegin', haberHTML);
        if (Notification.permission === 'granted') {
            new Notification('Yeni GS Haberi', { body: haber.mesaj });
            bildirimSesi.play();
        }
    }

    socket.on('yeni_haber', (haber) => { ekranaHaberBas(haber); });

    function bildirimIzniIste() {
        if (Notification.permission !== "granted") {
            Notification.requestPermission().then(p => { if(p === "granted") alert("İzin verildi!"); });
        }
    }
</script>
</body>
</html>
